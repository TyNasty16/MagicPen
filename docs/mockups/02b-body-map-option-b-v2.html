<!doctype html><html><head><meta charset="utf-8">
<style>
:root{--bg:#f7f1ea;--card:#fffaf5;--ink:#3a2a22;--muted:#6f5b4c;--accent:#a85540;--line:#eadfd3;--track:#efe5da;--head:Georgia,"New York",serif;--shadow:0 6px 18px rgba(80,50,30,.08)}
*{box-sizing:border-box}body{margin:0;background:#ebe3d9;font-family:system-ui,-apple-system,sans-serif;color:var(--ink);padding:24px;display:flex;gap:24px}
.panel{width:390px;background:var(--bg);border-radius:30px;padding:18px 16px;box-shadow:0 16px 40px rgba(60,40,20,.14)}
h3{font-family:var(--head);font-size:22px;margin:4px 0 12px;font-weight:600}
.card{background:var(--card);border-radius:22px;padding:14px 10px;box-shadow:var(--shadow)}
.legend{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--muted);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sel{margin:10px 4px 0;background:var(--track);border-radius:14px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between}.sel b{color:var(--accent)}
</style></head><body>
<div class="panel"><h3>Option B, redrawn</h3><div class="card"><svg id="b" width="100%"></svg>
 <div class="legend"><span><i style="background:#e9b9a6"></i>Used recently</span><span><i style="background:#bccfa9"></i>Rested</span><span><i style="border:1.5px dashed #a85540;background:#fff"></i>Suggested</span></div>
 <div class="sel">Selected <b>Left thigh · suggested</b></div></div></div>
<div class="panel"><h3>Same, back arm selected</h3><div class="card"><svg id="c" width="100%"></svg>
 <div class="legend"><span><i style="background:#e9b9a6"></i>Used recently</span><span><i style="background:#bccfa9"></i>Rested</span><span><i style="border:1.5px dashed #a85540;background:#fff"></i>Suggested</span></div>
 <div class="sel">Selected <b>Right upper arm</b></div></div></div>
<script>
// Right half of the figure (viewer's right), from the neck clockwise; 8-head proportions, arms slightly out (A-pose).
const R=[[100,49],[107,50],[109,62],[124,68],[141,72],[151,80],[156,94],[158,114],[161,136],[165,158],[169,182],[172,206],[175,228],[177,240],[180,252],[179,264],[174,270],[169,266],[167,254],[166,242],[163,228],[158,206],[153,184],[149,162],[145,140],[141,118],[137,103],[135,118],[134,142],[130,166],[129,182],[134,204],[139,224],[140,248],[138,276],[134,304],[133,326],[134,346],[131,370],[127,390],[131,398],[126,404],[112,404],[110,392],[109,370],[107,344],[107,320],[106,292],[104,262],[101,244],[100,242]];
const OUT=[...R,...R.slice(1,-1).reverse().map(([x,y])=>[200-x,y])];
function smooth(p){const n=p.length;let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<n;i++){const a=p[(i-1+n)%n],b=p[i],c=p[(i+1)%n],e=p[(i+2)%n];d+=` C${(b[0]+(c[0]-a[0])/6).toFixed(1)},${(b[1]+(c[1]-a[1])/6).toFixed(1)} ${(c[0]-(e[0]-b[0])/6).toFixed(1)},${(c[1]-(e[1]-b[1])/6).toFixed(1)} ${c[0]},${c[1]}`}return d+'Z'}
const COL={recent:['#e9b9a6','#cf8f78'],ready:['#bccfa9','#8fa87a']};
const STROKE='#b89c84', FILL='#f6ede3';
function zone(z){const [cx,cy,rx,ry,rot=0]=z.g;const t=`transform="rotate(${rot} ${cx} ${cy})"`;let h='';
 if(z.state==='on') h+=`<ellipse ${t} cx="${cx}" cy="${cy}" rx="${rx+5}" ry="${ry+5}" fill="#a85540" opacity=".2"/><ellipse ${t} cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#a85540"/>`;
 else h+=`<ellipse ${t} cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${COL[z.state][0]}" fill-opacity=".8" stroke="${COL[z.state][1]}" stroke-width="1.2"/>`;
 if(z.sug) h+=`<ellipse ${t} cx="${cx}" cy="${cy}" rx="${rx+8}" ry="${ry+8}" fill="none" stroke="#a85540" stroke-width="1.6" stroke-dasharray="4 3"/>`;
 return h}
function figure(x0,back,zones){
 let h=`<g transform="translate(${x0} 0)">`;
 h+=`<path d="${smooth(OUT)}" fill="${FILL}" stroke="${STROKE}" stroke-width="1.4" stroke-linejoin="round"/>`;
 h+=`<ellipse cx="100" cy="27" rx="17" ry="22" fill="${FILL}" stroke="${STROKE}" stroke-width="1.4"/>`;
 if(!back){h+=`<circle cx="100" cy="176" r="1.8" fill="${STROKE}"/>`;}
 else{h+=`<path d="M100 74 V200" stroke="#dccab8" stroke-width="1.2"/><path d="M84 92 q-8 18 2 34 M116 92 q8 18 -2 34" fill="none" stroke="#e3d3c3" stroke-width="1.2"/><path d="M100 214 V240" stroke="#dccab8" stroke-width="1.2"/>`;}
 return h+zones.map(zone).join('')+'</g>'}
const T='font-size="11" font-weight="700" letter-spacing="1.2" fill="#6f5b4c"', t2='font-size="10" font-weight="600" fill="#8a7464"';
function draw(id,states){
 const s=document.getElementById(id);s.setAttribute('viewBox','10 0 400 432');
 s.innerHTML=figure(0,false,[{g:[88,196,8.5,12],state:states.br},{g:[112,196,8.5,12],state:states.bl},{g:[74,272,10,22,4],state:states.tr},{g:[126,272,10,22,-4],state:states.tl,sug:states.sug==='tl'}])
 +figure(210,true,[{g:[50,128,6,16,8],state:states.al},{g:[150,128,6,16,-8],state:states.ar}])
 +`<text x="100" y="426" text-anchor="middle" ${T}>FRONT</text><text x="310" y="426" text-anchor="middle" ${T}>BACK</text>`
 +`<text x="22" y="290" text-anchor="middle" ${t2}>Right</text><text x="178" y="290" text-anchor="middle" ${t2}>Left</text><text x="232" y="290" text-anchor="middle" ${t2}>Left</text><text x="388" y="290" text-anchor="middle" ${t2}>Right</text>`;
 s.setAttribute('height','400')}
draw('b',{br:'recent',bl:'recent',tr:'ready',tl:'on',sug:'tl',al:'ready',ar:'ready'});
draw('c',{br:'recent',bl:'recent',tr:'ready',tl:'ready',sug:'tl',al:'ready',ar:'on'});
</script></body></html>
