<!doctype html><html><head><meta charset="utf-8"><title>Protein shaker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#f7f1ea;font-family:Inter,system-ui,sans-serif;color:#3a2a22;width:390px}
.wrap{padding:16px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.card{background:#fffaf5;border-radius:22px;box-shadow:0 6px 18px rgb(80 50 30 / .08);padding:16px 14px}
.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:600;color:#6f5b4c} .muted{color:#6f5b4c} .serif{font-family:Georgia,serif}
</style></head><body><div class="wrap"><div class="grid">
<div class="card" id="tile"><div style="display:flex;justify-content:space-between"><span class="eyebrow">NUTRITION</span><span class="muted">›</span></div>
 <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px">
  <div><span class="serif" style="font-size:24px;font-weight:600" id="g">84 g</span> <span class="muted" style="font-size:13px">of 114</span><div style="font-size:13px;font-weight:600">Protein</div></div>
  <div id="bottle"></div></div>
 <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px">
  <svg width="34" height="34" style="transform:rotate(-90deg)"><circle cx="17" cy="17" r="13" fill="none" stroke="#efe5da" stroke-width="5"/><circle cx="17" cy="17" r="13" fill="none" stroke="#c8735a" stroke-width="5" stroke-linecap="round" stroke-dasharray="51.5 82"/></svg>
  <div style="line-height:1.15"><div style="font-size:14px;font-weight:600">1,240 <span style="font-size:12px;font-weight:400" class="muted">of 1,982</span></div><div style="font-size:11px" class="muted">Calories</div></div></div>
</div>
<div class="card"><div class="eyebrow">WATER</div><div style="margin-top:12px"><span class="serif" style="font-size:34px;font-weight:600">42</span> <span class="muted">/ 90 fl oz</span></div>
<div style="height:8px;background:#efe5da;border-radius:4px;margin-top:10px"><div style="width:47%;height:100%;background:#2f6fb5;border-radius:4px"></div></div>
<div style="border:1px solid #eadfd3;border-radius:16px;text-align:center;padding:12px 0;margin-top:16px;color:#a85540;font-weight:600;font-size:18px">+ 8 fl oz</div></div>
</div></div>
<script>
const GOAL = 114;
let LID = 'a';
// Lid A: low, wide dome seen slightly from above; flip cover lies flat with an upright carry loop at the back.
function lidA() {
  return `
    <path d="M14,66 L14,58 Q14,48 20,44 L76,44 Q82,48 82,58 L82,66 Q82,68 80,68 L16,68 Q14,68 14,66 Z" fill="url(#lid)"/>
    <path d="M14,66 L14,58 Q14,48 20,44 L76,44 Q82,48 82,58 L82,66 Q82,68 80,68 L16,68 Q14,68 14,66 Z" fill="url(#lidSide)"/>
    <rect x="15" y="61" width="66" height="1" fill="#000" opacity=".45"/><rect x="15" y="62" width="66" height=".8" fill="#fff" opacity=".08"/>
    <ellipse cx="48" cy="44" rx="28" ry="6.5" fill="#3e3835"/>
    <ellipse cx="48" cy="43.4" rx="27" ry="5.6" fill="#45403c"/>
    <path d="M24,46 Q48,51 72,46" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1"/>
    <path d="M42,44 L42,30 Q42,26 46,26 L50,26 Q54,26 54,30 L54,44" fill="none" stroke="url(#cover)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M30,46.5 Q30,40 36,40 L60,40 Q66,40 66,46.5 Q48,50.5 30,46.5 Z" fill="url(#cover)"/>
    <ellipse cx="38" cy="44" rx="4" ry="1.8" fill="#000" opacity=".25"/>
    <path d="M34,41.2 L62,41.2" stroke="#fff" stroke-opacity=".3" stroke-width=".9"/>`;
}
// Lid B: taller rounded cap with a moulded grip band; spout cover is a rounded block with a loop hole.
function lidB() {
  return `
    <path d="M15,68 L15,52 C15,40 24,32 36,32 L60,32 C72,32 81,40 81,52 L81,68 Z" fill="url(#lid)"/>
    <path d="M15,68 L15,52 C15,40 24,32 36,32 L60,32 C72,32 81,40 81,52 L81,68 Z" fill="url(#lidSide)"/>
    ${Array.from({ length: 16 }, (_, i) => `<rect x="${17 + i * 4}" y="56" width="1.3" height="10" fill="#000" opacity=".22"/>`).join('')}
    <rect x="15" y="54" width="66" height="1.2" fill="#000" opacity=".35"/>
    <path d="M33,34 L35,24 Q36,20 40,20 L56,20 Q60,20 61,24 L63,34 Z" fill="url(#cover)"/>
    <rect x="41.5" y="23" width="13" height="6" rx="3" fill="#2b2725"/>
    <path d="M36,21.5 L60,21.5" stroke="#fff" stroke-opacity=".3" stroke-width=".9"/>`;
}
// Draws the shaker (inspired by tall faceted shaker bottles; original design). level 0..1, angle (shake), slosh -1..1.
function shaker(level, angle = 0, slosh = 0) {
  const W = 96, H = 186, top = 62, bot = 174, L0 = 20, R0 = 76, L1 = 25, R1 = 71, ch = 7; // slim body, slight taper, chamfered base
  const xAt = (side, y) => side < 0 ? L1 + (L0 - L1) * (bot - y) / (bot - top) : R1 + (R0 - R1) * (bot - y) / (bot - top);
  const body = `M${L0},${top} L${R0},${top} L${R1},${bot - ch} L${R1 - ch},${bot} L${L1 + ch},${bot} L${L1},${bot - ch} Z`;
  const lvl = bot - 3 - (bot - top - 8) * Math.min(1, level);
  const tilt = slosh * 7;
  const surf = `M0,${lvl - tilt} C30,${lvl - tilt * 0.4 - 2} 66,${lvl + tilt * 0.4 + 2} 96,${lvl + tilt}`;
  // Flat panels: four vertical facets catching the light differently.
  const cols = [L0, 34, 48, 62, R0], colsB = [L1, 36, 48, 60, R1], shades = [0.10, 0.0, 0.05, 0.16];
  const facets = shades.map((a, i) => `<path d="M${cols[i]},${top} L${cols[i + 1]},${top} L${colsB[i + 1]},${bot} L${colsB[i]},${bot} Z" fill="#1d1a2b" opacity="${a}"/>`).join('');
  const edges = [34, 48, 62].map((x, i) => `<line x1="${x}" y1="${top + 2}" x2="${colsB[i + 1]}" y2="${bot - 2}" stroke="#fff" stroke-opacity=".35" stroke-width=".8"/>`).join('');
  let ticks = '';
  for (let g = 20; g < GOAL; g += 20) {
    const y = bot - 3 - (bot - top - 8) * (g / GOAL), x = 30 + (y - top) / (bot - top) * 2;
    ticks += `<line x1="${x}" x2="${x + (g % 40 ? 5 : 9)}" y1="${y}" y2="${y}" stroke="#fff" stroke-width="1.2" opacity=".75"/><text x="${x + 11}" y="${y + 2.6}" font-size="7" font-weight="700" fill="#fff" opacity=".85" stroke="#2a2433" stroke-opacity=".35" stroke-width=".6" paint-order="stroke">${g}</text>`;
  }
  return `<svg width="${W}" height="${H + 8}" viewBox="0 -4 ${W} ${H + 8}" role="img" aria-label="Protein shaker, ${Math.round(level * GOAL)} of ${GOAL} g">
  <defs>
    <clipPath id="b"><path d="${body}"/></clipPath>
    <linearGradient id="tint" x1="0" x2="1"><stop offset="0" stop-color="#e7d9cf" stop-opacity=".85"/><stop offset=".5" stop-color="#efe5dc" stop-opacity=".7"/><stop offset="1" stop-color="#d7c6b9" stop-opacity=".9"/></linearGradient>
    <linearGradient id="shake" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#9a6646"/><stop offset="1" stop-color="#6a3f26"/></linearGradient>
    <linearGradient id="lid" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4b4542"/><stop offset=".55" stop-color="#2b2725"/><stop offset="1" stop-color="#1e1b1a"/></linearGradient>
    <linearGradient id="lidSide" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".3" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
    <linearGradient id="cover" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#b9634c"/><stop offset="1" stop-color="#8f4230"/></linearGradient>
    <radialGradient id="floor"><stop offset="0" stop-color="#3a2a22" stop-opacity=".22"/><stop offset="1" stop-color="#3a2a22" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="48" cy="${bot + 4}" rx="30" ry="4.5" fill="url(#floor)"/>
  <g transform="rotate(${angle} 48 ${bot})">
    <path d="${body}" fill="url(#tint)"/>
    <g clip-path="url(#b)">
      <path d="${surf} L96,${H} L0,${H} Z" fill="url(#shake)"/>
      <path d="${surf} L96,${lvl + tilt + 4} C66,${lvl + tilt * 0.4 + 6} 30,${lvl - tilt * 0.4 + 2} 0,${lvl - tilt + 4} Z" fill="#d8bfa3"/>
      ${[[38, 0.4, 1.3], [55, 0.25, 1], [64, 0.6, 1.2]].map(([x, f, r]) => `<circle cx="${x}" cy="${lvl + 7 + f * (bot - lvl - 12)}" r="${r}" fill="#fff" opacity=".2"/>`).join('')}
      ${facets}${edges}
    </g>
    <path d="${body}" fill="none" stroke="#2a2433" stroke-opacity=".3" stroke-width="1"/>
    ${ticks}
    <path d="M${L0 + 4},${top + 6} L${L1 + 3},${bot - 12}" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".65"/>
    ${LID === 'b' ? lidB() : lidA()}
  </g></svg>`;
}
window.render = (level, angle, slosh, grams, lid) => { if (lid) LID = lid; document.getElementById('bottle').innerHTML = shaker(level, angle, slosh); if (grams !== undefined) document.getElementById('g').textContent = grams + ' g'; };
render(84 / GOAL, 0, 0);
</script></body></html>
