<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box} body{width:390px;background:#f7f1ea;color:#3a2a22;font-family:Inter,system-ui,sans-serif} .wrap{padding:22px 16px 20px}

<div style="font-size:11.5px;color:#6f5b4c;margin-top:4px">Top source: protein shake</div><div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px"><svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17.0" cy="17.0" r="14.5" fill="none" stroke="#efe5da" stroke-width="5"/><circle cx="17.0" cy="17.0" r="14.5" fill="none" stroke="#c8735a" stroke-width="5" stroke-linecap="round" stroke-dasharray="57.0 91.106186954104" transform="rotate(-90 17.0 17.0)"/></svg><div style="line-height:1.15"><div style="font-size:14px;font-weight:600">1,240 <span style="font-size:12px;font-weight:400;color:#6f5b4c">of 1,982</span></div><div style="font-size:11px;color:#6f5b4c">Calories</div></div></div></div><div class="card" style="padding:16px 14px"><div class="eyebrow">WATER</div><div style="margin-top:12px"><span class="serif" style="font-size:34px;font-weight:600">42</span> <span class="muted">/ 90 fl oz</span></div>
