<!doctype html><html><head><meta charset="utf-8"><title>Water glass</title>
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#f7f1ea;font-family:Inter,system-ui,sans-serif;color:#3a2a22;width:390px}
.wrap{padding:16px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.card{background:#fffaf5;border-radius:22px;box-shadow:0 6px 18px rgb(80 50 30 / .08);padding:16px 14px}
.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:600;color:#6f5b4c} .muted{color:#6f5b4c} .serif{font-family:Georgia,serif}
.btn{border:1px solid #eadfd3;border-radius:16px;text-align:center;padding:11px 0;margin-top:10px;color:#a85540;font-weight:600;font-size:17px}
</style></head><body><div class="wrap"><div class="grid">
<div class="card" id="tile"><div class="eyebrow">WATER</div>
 <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px"><div style="white-space:nowrap"><div class="serif" style="font-size:26px;font-weight:600;line-height:1" id="oz">42</div><div class="muted" style="font-size:12px;margin-top:3px">of 90 fl oz</div><div id="goal" style="font-size:12px;font-weight:600;color:#3b7a57;margin-top:4px;visibility:hidden">Goal reached ✓</div></div><div id="glass"></div></div>
 <div class="btn">+ 8 fl oz</div></div>
<div></div></div></div>
<script>
const GOAL = 90;
// Ice cubes: x, depth below the surface (negative = poking out), size, tilt. Some float at the top, a couple sit lower.
const ICE = [[30, -4, 14, -12], [47, -3, 13, 10], [62, -2, 12, -6], [38, 9, 12, 22], [55, 13, 11, -18], [44, 24, 10, 8]];
// faucet: 0 hidden → 1 in place (slides in from the right); stream: { top, bottom } as 0..1 of the fall, or null; ft: time for the stream's wobble.
function glass({ level, angle = 0, ripple = 0, drop = null, drink = false, bob = 0, faucet = 0, stream = null, ft = 0 }) {
  const top = 40, bot = 168, body = `M16,${top} L80,${top} L72,${bot - 6} Q71,${bot} 65,${bot} L31,${bot} Q25,${bot} 24,${bot - 6} Z`;
  const y = bot - 6 - (bot - top - 12) * Math.min(1, Math.max(0, level));
  const amp = 2.5 + ripple * 3, ph = ripple * Math.PI * 4;
  const surf = `M0,${y + Math.sin(ph) * amp * .4} C29,${y - amp * Math.cos(ph)} 62,${y + amp * Math.cos(ph)} 96,${y - Math.sin(ph) * amp * .4}`;
  const iceY = (d) => y + d + bob * (d < 6 ? 1 : .4);
  const cubes = level > 0.06 && !drink ? ICE.filter(([, d]) => iceY(d) < bot - 10).map(([x, d, s, r]) => `<g transform="rotate(${r + bob * 6} ${x + s / 2} ${iceY(d) + s / 2})"><rect x="${x}" y="${iceY(d)}" width="${s}" height="${s}" rx="3" fill="#f4fbff" opacity="${d < 0 ? .8 : .5}" stroke="#a9cfe6" stroke-width=".9"/><path d="M${x + 3},${iceY(d) + 3} l${s * .35},0" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".9"/></g>`).join('') : '';
  // Once drunk, a few cubes are left resting on the bottom.
  const leftover = level <= 0.06 && !drink ? [[33, 12, -14], [46, 12, 9], [58, 11, -4], [40, 11, 25]].map(([x, sz, r], k) => { const yy = bot - 8 - sz - (k === 3 ? 9 : 0); return `<g transform="rotate(${r} ${x + sz / 2} ${yy + sz / 2})"><rect x="${x}" y="${yy}" width="${sz}" height="${sz}" rx="3" fill="#f4fbff" opacity=".85" stroke="#a9cfe6" stroke-width=".9"/><path d="M${x + 3},${yy + 3} l${sz * .35},0" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></g>`; }).join('') : '';
  const water = drink
    ? `<path d="M0,0 L96,0 L96,${top + (bot - top) * level + 4} C64,${top + (bot - top) * level} 32,${top + (bot - top) * level + 8} 0,${top + (bot - top) * level + 4} Z" fill="url(#w)"/>`
    : level > 0 ? `<path d="${surf} L96,200 L0,200 Z" fill="url(#w)"/><path d="${surf} L96,${y + 3} C64,${y + 5} 30,${y + 1} 0,${y + 3} Z" fill="#fff" opacity=".45"/>` : '';
  const rings = ripple > 0 && ripple < 1 && !drink ? [0, .35].map((o) => { const k = Math.max(0, ripple - o) / (1 - o); return k > 0 ? `<ellipse cx="48" cy="${y}" rx="${4 + k * 26}" ry="${1 + k * 3}" fill="none" stroke="#fff" stroke-width="${1.6 * (1 - k)}" opacity="${.9 * (1 - k)}"/>` : ''; }).join('') : '';
  // Faucet and stream (replaces the falling drop).
  const nozX = 50, nozY = 4;
  const fx = (1 - faucet) * 40;
  const faucetEl = faucet > 0 ? `<g transform="translate(${fx} 0)" opacity="${Math.min(1, faucet * 1.4)}">
    <defs><linearGradient id="chrome" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset=".45" stop-color="#b9c2ca"/><stop offset=".55" stop-color="#8d98a3"/><stop offset="1" stop-color="#dfe5ea"/></linearGradient>
    <linearGradient id="chromeV" x1="0" x2="1"><stop offset="0" stop-color="#dfe5ea"/><stop offset=".5" stop-color="#8d98a3"/><stop offset="1" stop-color="#eef2f5"/></linearGradient></defs>
    <path d="M98,-14 L62,-14 Q${nozX - 4},-14 ${nozX - 4},-2 L${nozX - 4},${nozY - 2} L${nozX + 4},${nozY - 2} L${nozX + 4},-2 Q${nozX + 4},-6 62,-6 L98,-6 Z" fill="url(#chrome)" stroke="#6f7b86" stroke-opacity=".5" stroke-width=".6"/>
    <rect x="${nozX - 6}" y="${nozY - 3}" width="12" height="4" rx="1.5" fill="url(#chromeV)" stroke="#6f7b86" stroke-opacity=".5" stroke-width=".6"/>
    <rect x="76" y="-22" width="8" height="10" rx="2" fill="url(#chromeV)"/><rect x="72" y="-25" width="16" height="4" rx="2" fill="#c8735a"/><rect x="96" y="-17" width="4" height="14" rx="1.5" fill="url(#chromeV)"/>
    <path d="M64,-12.5 L96,-12.5" stroke="#fff" stroke-opacity=".8" stroke-width="1"/></g>` : '';
  let streamEl = '';
  if (stream) {
    const y0 = nozY + 1 + (y - nozY - 1) * stream.top, y1 = nozY + 1 + (y - nozY - 1) * stream.bottom;
    if (y1 > y0 + 1) {
      const pts = []; for (let k = 0; k <= 8; k++) { const yy = y0 + (y1 - y0) * k / 8; pts.push([yy, Math.sin(ft * 18 + k * 1.3) * 0.7 * (k / 8)]); }
      const w = 2.6 + (1 - stream.top) * 0.6;
      const left = pts.map(([yy, o]) => `${nozX - w + o},${yy}`).join(' L'), right = pts.slice().reverse().map(([yy, o]) => `${nozX + w + o},${yy}`).join(' L');
      streamEl = `<path d="M${left} L${right} Z" fill="url(#w)" opacity=".95"/><path d="M${pts.map(([yy, o]) => `${nozX - 1 + o},${yy}`).join(' L')}" stroke="#fff" stroke-width=".9" opacity=".8" fill="none"/>`;
      if (stream.bottom >= 1 && stream.top < 1) streamEl += [0, 1, 2, 3, 4, 5].map((k) => { const a = ft * 9 + k * 1.1; return `<circle cx="${nozX + Math.cos(a * 1.3 + k) * (4 + k)}" cy="${y - 1.5 - Math.abs(Math.sin(a)) * 4}" r="${0.8 + (k % 3) * 0.4}" fill="#fff" opacity=".85"/>`; }).join('') + `<ellipse cx="${nozX}" cy="${y + .5}" rx="8" ry="1.8" fill="#fff" opacity=".55"/>`;
    }
  }
  const dropEl = drop !== null ? `<path d="M48,${drop - 7} C51,${drop - 2} 52,${drop + 1} 48,${drop + 3} C44,${drop + 1} 45,${drop - 2} 48,${drop - 7} Z" fill="#5aa8dc"/>` : '';
  return `<svg width="80" height="156" viewBox="0 18 96 162" style="overflow:visible"><defs>
  <linearGradient id="w" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8fd0ef" stop-opacity=".85"/><stop offset="1" stop-color="#2f7fbf" stop-opacity=".95"/></linearGradient>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset=".2" stop-color="#eef3f6" stop-opacity=".45"/><stop offset=".8" stop-color="#e6edf2" stop-opacity=".45"/><stop offset="1" stop-color="#cfd9e0" stop-opacity=".8"/></linearGradient>
  <radialGradient id="f"><stop offset="0" stop-color="#3a2a22" stop-opacity=".2"/><stop offset="1" stop-color="#3a2a22" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><path d="${body}"/></clipPath></defs>
  <ellipse cx="48" cy="${bot + 3}" rx="30" ry="4" fill="url(#f)"/>
  ${faucetEl}${dropEl}
  <g transform="rotate(${angle} 48 ${Math.abs(angle) > 20 ? 96 : bot})">
   <path d="${body}" fill="url(#g)"/>
   <g clip-path="url(#c)">${water}${cubes}${leftover}${rings}${!drink && level > 0 ? [[30, .5], [58, .3], [44, .78]].map(([x, k]) => `<circle cx="${x}" cy="${y + 12 + k * (bot - y - 20)}" r="1.4" fill="#fff" opacity=".6"/>`).join('') : ''}</g>
   <path d="${body}" fill="none" stroke="#2a4a60" stroke-opacity=".3"/>
   <ellipse cx="48" cy="${top}" rx="32" ry="3.5" fill="none" stroke="#2a4a60" stroke-opacity=".25"/>
   <path d="M22,${top + 8} L29,${bot - 14}" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".75"/>
  </g>${streamEl}</svg>`;
}
window.render = (s, oz, goal) => { document.getElementById('glass').innerHTML = glass(s); if (oz !== undefined) document.getElementById('oz').textContent = oz; document.getElementById('goal').style.visibility = goal ? 'visible' : 'hidden'; };
render({ level: 42 / GOAL });
</script></body></html>
