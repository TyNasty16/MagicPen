# Builds Steady and publishes it to GitHub Pages: https://tynasty16.github.io/MagicPen/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (which runs npm ci and the tests) can only read the repo.
# Only the deploy job may publish. This protects the deploy token; it cannot stop a
# poisoned dependency from ending up in the built site, which is why updates are
# tested on pull requests first (test.yml) and Dependabot waits 7 days.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false # never cut a deployment off halfway

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /MagicPen/
      # Refuse to publish if the browser safety rule (CSP) is missing or comes after a script or stylesheet.
      - name: Check the CSP is in the built page, before every script and stylesheet
        run: |
          csp=$(grep -n 'http-equiv="Content-Security-Policy"' dist/index.html | head -1 | cut -d: -f1)
          first=$(grep -nE '<script|<link' dist/index.html | head -1 | cut -d: -f1)
          test -n "$csp" && test -n "$first" && test "$csp" -lt "$first"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
